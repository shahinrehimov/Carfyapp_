name: carfy
description: "A new Flutter project."

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  dio: ^5.9.0
  injectable: ^2.5.2
  intl: ^0.20.2
  equatable: ^2.0.7
  dartz: ^0.10.1
  flutter_bloc: ^9.1.1
  get_it: ^8.2.0
  auto_route: ^10.2.0
  flutter_svg: ^2.2.1
  encrypt: ^5.0.3
  shared_preferences: ^2.5.3
  flutter_native_splash: ^2.4.7
  flutter_gen: ^5.12.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  auto_route_generator: ^10.2.5
  build_runner: ^2.10.1
  injectable_generator: ^2.9.0
  flutter_gen_runner: ^5.12.0

flutter_native_splash:
  color: "#F7FBFE"
  image: assets/images/splash-logo.png
  android: true
  ios: true

  # Optional settings:
  android_12:
    image: assets/images/splash-logo-android12.png
    icon_background_color: "#F7FBFE"

flutter_gen:
  output: lib/gen/
  line_length: 120
  colors:
    enabled: false

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/



