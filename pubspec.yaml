name: carfy
description: "A new Flutter project."

version: 1.0.0+2

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  dio: ^5.9.0
  injectable: ^2.5.2
  intl: ^0.20.2
  equatable: ^2.0.7
  dartz: ^0.10.1
  flutter_bloc: ^9.1.1
  get_it: ^8.2.0
  auto_route: ^10.2.0
  flutter_svg: ^2.2.1
  encrypt: ^5.0.3
  shared_preferences: ^2.5.3
  flutter_native_splash: ^2.4.7
  flutter_gen: ^5.12.0
  pinput: ^6.0.1
  hive_ce: ^2.15.1
  hive_ce_flutter: ^2.3.3
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  flutter_map: ^8.1.1
  latlong2: ^0.9.1
  geolocator: ^13.0.4
  device_info_plus: ^11.4.0
  dio_curl_logger: ^1.3.0
  toastification: ^3.0.3
  url_launcher: ^6.3.1
  firebase_core: ^4.5.0
  firebase_analytics: ^12.1.3
  firebase_crashlytics: ^5.0.8
  firebase_messaging: ^16.1.2
  firebase_remote_config: ^6.2.0
  package_info_plus: ^8.3.0
  flutter_local_notifications: ^21.0.0
  flutter_inappwebview: ^6.1.5
  collection: ^1.19.0
  connectivity_plus: ^6.0.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  auto_route_generator: ^10.2.5
  build_runner: ^2.10.1
  injectable_generator: ^2.9.0
  flutter_gen_runner: ^5.12.0
  hive_ce_generator: ^1.10.1
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "logo.png"
  image_path_ios: "logo_ios.png"
  background_color: "#3696E7"
  adaptive_icon_background: "#3696E7"
  adaptive_icon_foreground: "logo.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#F7FBFE"
  image: assets/images/splash-logo.png
  android: true
  ios: true

  # Optional settings:
  android_12:
    image: assets/images/splash-logo-android12.png
    icon_background_color: "#F7FBFE"

flutter_gen:
  output: lib/gen/
  line_length: 120
  colors:
    enabled: false

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/



